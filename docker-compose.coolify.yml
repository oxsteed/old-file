services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
        VITE_SENTRY_SEND_DEFAULT_PII: ${VITE_SENTRY_SEND_DEFAULT_PII:-false}
        SENTRY_RELEASE: ${SENTRY_RELEASE}
        COMMIT_SHA: ${COMMIT_SHA}
        SOURCE_COMMIT: ${SOURCE_COMMIT}
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      CLIENT_URL: ${CLIENT_URL}
      COMMIT_SHA: ${COMMIT_SHA}
      SOURCE_COMMIT: ${SOURCE_COMMIT}
      CLAMAV_HOST: ${CLAMAV_HOST}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-5000}
      DATABASE_URL: ${DATABASE_URL}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DIDIT_API_KEY: ${DIDIT_API_KEY}
      DIDIT_WEBHOOK_SECRET: ${DIDIT_WEBHOOK_SECRET}
      EMAIL_FROM: ${EMAIL_FROM}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      OXSTEED_CREDIT_LEDGER_HMAC_SECRET: ${OXSTEED_CREDIT_LEDGER_HMAC_SECRET}
      OXSTEED_CREDIT_LEDGER_HMAC_KEY_VERSION: ${OXSTEED_CREDIT_LEDGER_HMAC_KEY_VERSION:-v1}
      OXSTEED_CREDIT_LEDGER_HMAC_KEYS_JSON: ${OXSTEED_CREDIT_LEDGER_HMAC_KEYS_JSON}
      OXSTEED_CREDIT_SUPPORTED_CURRENCIES: ${OXSTEED_CREDIT_SUPPORTED_CURRENCIES}
      OXSTEED_CREDIT_ALLOW_CUSTOMER_TRANSFERS: ${OXSTEED_CREDIT_ALLOW_CUSTOMER_TRANSFERS:-false}
      OXSTEED_CREDIT_MAX_TRANSACTION_CENTS: ${OXSTEED_CREDIT_MAX_TRANSACTION_CENTS:-250000}
      OXSTEED_CREDIT_MAX_CUSTOMER_BALANCE_CENTS: ${OXSTEED_CREDIT_MAX_CUSTOMER_BALANCE_CENTS:-1000000}
      OXSTEED_CREDIT_MAX_TOTAL_ISSUANCE_CENTS: ${OXSTEED_CREDIT_MAX_TOTAL_ISSUANCE_CENTS:-5000000}
      OXSTEED_CREDIT_MAX_DAILY_CUSTOMER_ISSUANCE_CENTS: ${OXSTEED_CREDIT_MAX_DAILY_CUSTOMER_ISSUANCE_CENTS:-1000000}
      OXSTEED_CREDIT_MAX_DAILY_CUSTOMER_TRANSFER_CENTS: ${OXSTEED_CREDIT_MAX_DAILY_CUSTOMER_TRANSFER_CENTS:-1000000}
      OXSTEED_CREDIT_MAX_DAILY_CUSTOMER_TRANSFER_COUNT: ${OXSTEED_CREDIT_MAX_DAILY_CUSTOMER_TRANSFER_COUNT:-20}
      OXSTEED_CREDIT_MAX_DAILY_CUSTOMER_SPEND_CENTS: ${OXSTEED_CREDIT_MAX_DAILY_CUSTOMER_SPEND_CENTS:-1000000}
      OXSTEED_CREDIT_MAX_DAILY_CUSTOMER_SPEND_COUNT: ${OXSTEED_CREDIT_MAX_DAILY_CUSTOMER_SPEND_COUNT:-50}
      OXSTEED_CREDIT_HOLD_TTL_MINUTES: ${OXSTEED_CREDIT_HOLD_TTL_MINUTES:-30}
      OXSTEED_CREDIT_MAX_HOLD_TTL_MINUTES: ${OXSTEED_CREDIT_MAX_HOLD_TTL_MINUTES:-1440}
      OXSTEED_CREDIT_MAX_AGREEMENT_LIMIT_CENTS: ${OXSTEED_CREDIT_MAX_AGREEMENT_LIMIT_CENTS}
      OXSTEED_CREDIT_NOTIFICATION_RETENTION_DAYS: ${OXSTEED_CREDIT_NOTIFICATION_RETENTION_DAYS:-90}
      FILE_SCAN_REQUIRE_MALWARE: ${FILE_SCAN_REQUIRE_MALWARE:-false}
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_SUPPORT_MODEL: ${OPENAI_SUPPORT_MODEL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL}
      OPENROUTER_SUPPORT_MODEL: ${OPENROUTER_SUPPORT_MODEL}
      PORT: 5000
      REDIS_URL: ${REDIS_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      SECURITY_ALERT_EMAIL: ${SECURITY_ALERT_EMAIL}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENABLED: ${SENTRY_ENABLED:-true}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.2}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0}
      SLACK_SECURITY_WEBHOOK: ${SLACK_SECURITY_WEBHOOK}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER}
      SUPPORT_AI_TIMEOUT_MS: ${SUPPORT_AI_TIMEOUT_MS:-2500}
      STRIPE_CONNECT_CLIENT_ID: ${STRIPE_CONNECT_CLIENT_ID}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID}
      VITE_META_PIXEL_ID: ${VITE_META_PIXEL_ID}
    expose:
      - "5000"
    volumes:
      - /Users/oxsteed/Documents/GitHub/6/server/runtime/uploads:/app/server/runtime/uploads
    networks:
      - oxsteed-production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/ready"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

networks:
  oxsteed-production:
    external: true
    name: twsam5aiyvm0w1l2jqxx9ih3
