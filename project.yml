name: build-atom
options:
  bundleIdPrefix: com.oxsteed
  developmentLanguage: en

knownRegions:
  - en
  - es
  - fr
  - ht
  - ar
  - Base

settings:
  base:
    PRODUCT_NAME: OxSteed
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 121
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    TARGETED_DEVICE_FAMILY: '1,2'
    SUPPORTS_MACCATALYST: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  build-atom:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oxsteed.app
        CODE_SIGN_ENTITLEMENTS: build-atom/OxSteed.entitlements
    sources:
      - path: build-atom
      - path: Shared
    info:
      path: build-atom/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: 6.0
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [ arm64 ]
        NSPhotoLibraryUsageDescription: "OxSteed uses your photo library to attach images to jobs and messages."
        NSCameraUsageDescription: "OxSteed uses your camera to capture job photos."
        NSLocationWhenInUseUsageDescription: "OxSteed uses your location to show nearby opportunities, jobs, and helpers in the Growth tab."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: socket.io-client-swift
        product: SocketIO
      - target: OxSteedWidgets
        embed: true

  OxSteedWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: '17.0'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oxsteed.app.widgets
        CODE_SIGN_ENTITLEMENTS: OxSteedWidgets/OxSteedWidgets.entitlements
    sources:
      - path: OxSteedWidgets
      - path: Shared
    info:
      path: OxSteedWidgets/Info.plist

schemes:
  build-atom:
    build:
      targets:
        build-atom: all
    run:
      config: Debug
    archive:
      config: Release
packages:
  socket.io-client-swift:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.0.1
