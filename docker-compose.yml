services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: oxsteed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oxsteed
      POSTGRES_PASSWORD: dev-password-change-in-production
      POSTGRES_DB: oxsteed_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxsteed"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oxsteed-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: oxsteed-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://oxsteed:dev-password-change-in-production@postgres:5432/oxsteed_db?sslmode=disable
      
      # Server
      PORT: 5000
      NODE_ENV: production
      LOG_LEVEL: info
      
      # Auth
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-min-32-characters-long}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-32-bytes}
      
      # Stripe (configure with real keys in production)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_test_placeholder}
      STRIPE_CONNECT_CLIENT_ID: ${STRIPE_CONNECT_CLIENT_ID:-}
      
      # Redis
      REDIS_URL: redis://redis:6379/0
      
      # Optional services (disable in development as needed)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      DIDIT_API_KEY: ${DIDIT_API_KEY:-}
      DIDIT_WEBHOOK_SECRET: ${DIDIT_WEBHOOK_SECRET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_GEO_PLACES_ENABLED: ${AWS_GEO_PLACES_ENABLED:-false}
      AWS_GEO_PLACES_LANGUAGE: ${AWS_GEO_PLACES_LANGUAGE:-en}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      
      # Client URL (for CORS, password reset links, etc)
      CLIENT_URL: https://oxsteed.com
      APP_URL: https://oxsteed.com
      
      # Analytics (optional)
      VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
      VITE_META_PIXEL_ID: ${VITE_META_PIXEL_ID:-}
      
    ports:
      - "127.0.0.1:80:5000"
    volumes:
      - ./server:/app/server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
