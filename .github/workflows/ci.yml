name: CI

on:
  push:
    branches: [old-files-claude]
  pull_request:
    branches: [old-files-claude]

env:
  IMAGE_NAME: ghcr.io/oxsteed/old-file

jobs:
  install-check:
    name: Server and Client Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Generate client locale shards
        working-directory: client
        run: node scripts/splitLocaleCatalogs.mjs

      - name: Deployment command regression tests
        run: node --test scripts/deploy-coolify.test.cjs scripts/compute-content-release.test.cjs

      - name: Isolated Credit fixture regression tests
        run: node --test scripts/credit-isolated-seed.test.cjs

      - name: Client smoke tests
        working-directory: client
        run: node --test scripts/*.test.mjs

      - name: Client localization, type, and production build checks
        working-directory: client
        run: npm run build:ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Server regression and security tests
        working-directory: server
        env:
          NODE_ENV: test
        run: npm test -- --runInBand --forceExit

      - name: Active job status checks (Jest + optional pg_enum)
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          NODE_ENV: test
        run: |
          npm run test:active-job-statuses
          if [ -n "${DATABASE_URL}" ]; then
            npm run verify:active-job-statuses
            npm run verify:credit
            DIRECT_CATALOG_VERIFY_LIVE=true npm run verify:direct-catalog
          else
            echo "Skipping live database verification (set CI_DATABASE_URL secret for active-job, Credit schema, and Direct catalog checks)."
          fi

  build-image:
    name: Build and publish production image
    runs-on: ubuntu-latest
    needs: install-check
    if: github.ref == 'refs/heads/old-files-claude' && github.event_name == 'push'
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish immutable production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            SOURCE_COMMIT=${{ github.sha }}
            SENTRY_RELEASE=${{ github.sha }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_SENTRY_SEND_DEFAULT_PII=${{ vars.VITE_SENTRY_SEND_DEFAULT_PII || 'false' }}
            VITE_AWS_LOCATION_API_KEY=${{ secrets.VITE_AWS_LOCATION_API_KEY || vars.VITE_AWS_LOCATION_API_KEY }}
            VITE_AWS_LOCATION_REGION=${{ vars.VITE_AWS_LOCATION_REGION || 'us-east-1' }}
          cache-from: type=gha,scope=oxsteed-production-image
          cache-to: type=gha,mode=max,scope=oxsteed-production-image

  deploy:
    name: Deploy to Coolify
    runs-on: [self-hosted, coolify-local]
    needs: [install-check, build-image]
    if: github.ref == 'refs/heads/old-files-claude' && github.event_name == 'push'
    timeout-minutes: 25
    permissions:
      contents: read
    concurrency:
      group: coolify-production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Coolify image target and deploy
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_IMAGE_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_IMAGE_APPLICATION_UUID: ${{ vars.COOLIFY_IMAGE_APPLICATION_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_ALLOW_LOCAL_HTTP: 'true'
          COOLIFY_IMAGE_NAME: ${{ env.IMAGE_NAME }}
          COOLIFY_IMAGE_TAG: ${{ github.sha }}
        run: node scripts/deploy-coolify.cjs --deploy-image

      - name: Verify public production recovered after cutover
        if: vars.VERIFY_PUBLIC_AFTER_DEPLOY == 'true'
        env:
          PUBLIC_READY_URL: https://oxsteed.com/ready
          API_HEALTH_URL: https://api.oxsteed.com/health
        run: |
          set -euo pipefail

          wait_for_healthy_endpoint() {
            local url="$1"
            local label="$2"
            local status=""

            for attempt in $(seq 1 30); do
              status="$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "$url" || true)"
              if [ "$status" = "200" ]; then
                echo "$label is healthy (attempt $attempt)."
                return 0
              fi
              echo "$label is not ready yet (HTTP $status, attempt $attempt/30); waiting 10s."
              sleep 10
            done

            echo "$label did not become healthy within the deployment window."
            return 1
          }

          wait_for_healthy_endpoint "$PUBLIC_READY_URL" "Public readiness"
          wait_for_healthy_endpoint "$API_HEALTH_URL" "API health"

          ready_payload="$(curl --silent --show-error --fail --max-time 15 "$PUBLIC_READY_URL")"
          expected_content_release="$(node scripts/compute-content-release.cjs)"
          printf '%s' "$ready_payload" | node server/scripts/verify-readiness-payload.js \
            --expected-release="$GITHUB_SHA" \
            --expected-release="$expected_content_release"

          DIRECT_CATALOG_PUBLIC_API_URL=https://oxsteed.com/api/direct/catalog \
            node server/scripts/verify-direct-catalog-public-api.js

          DIRECT_CATALOG_PUBLIC_API_URL=https://oxsteed.com/api/direct/catalog \
          DIRECT_CATALOG_PERFORMANCE_LIVE=true \
            node server/scripts/verify-direct-catalog-performance.js
