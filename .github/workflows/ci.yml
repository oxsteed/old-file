concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: CI

on:
  push:
    branches: [old-files-claude]
  pull_request:
    branches: [old-files-claude]

jobs:
  install-check:
    name: Server and Client Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: ghcr.io/cloudnative-pg/postgis:16-3.4
        env:
          POSTGRES_USER: oxsteed
          POSTGRES_PASSWORD: statement-test-password
          POSTGRES_DB: credit_statement_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oxsteed -d credit_statement_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      logistics-postgres:
        image: ghcr.io/cloudnative-pg/postgis:16-3.4
        env:
          POSTGRES_USER: oxsteed
          POSTGRES_PASSWORD: synthetic-logistics-test-password
          POSTGRES_DB: credit_statement_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U oxsteed -d credit_statement_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Immutable migration history and filename order
        run: |
          node --test scripts/check-migration-history.test.cjs
          node scripts/check-migration-history.cjs

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Generate client locale shards
        working-directory: client
        run: node scripts/splitLocaleCatalogs.mjs

      - name: Deployment command regression tests
        run: node --test scripts/deploy-coolify.test.cjs scripts/compute-content-release.test.cjs scripts/provision-release-metadata.test.cjs scripts/reconcile-coolify-host.test.cjs scripts/reconcile-rejected-web-candidates.test.cjs scripts/install-coolify-host-reconciler.test.cjs scripts/verify-web-release.test.cjs scripts/promote-prebuilt-web.test.cjs scripts/install-web-release-observer.test.cjs scripts/watch-verified-web-image.test.cjs

      - name: Scale harness regression tests (V2-P1-05)
        run: node --test scripts/scale/scale-harness.test.cjs

      - name: Growth load test and replica-kill drill tooling tests (D-ENG-08)
        run: node --test scripts/growth/loadDrill.test.cjs

      - name: Isolated Credit fixture regression tests
        run: node --test scripts/credit-isolated-seed.test.cjs scripts/media-credit-isolated.test.cjs scripts/pull-ci-redis.test.cjs

      - name: Client smoke tests
        working-directory: client
        run: node --test scripts/*.test.mjs

      - name: Client src unit tests
        working-directory: client
        # N-10: bash without globstar expands src/**/*.test.mjs one level deep
        # only, silently skipping nested folders. find walks every depth.
        run: |
          mapfile -d '' tests < <(find src -name '*.test.mjs' -not -path '*/node_modules/*' -print0 | sort -z)
          echo "Running ${#tests[@]} client src test files"
          test "${#tests[@]}" -gt 0
          node --test "${tests[@]}"

      - name: Growth instrumentation coverage check
        working-directory: client
        run: node scripts/growthInstrumentation.mjs --check

      - name: Growth policy and notice content consistency
        run: node scripts/growth-policy-manifest.cjs --check

      - name: Client localization, type, and production build checks
        working-directory: client
        run: npm run build:ci

      - name: Install Chrome for browser regression tests
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install WebKit for the PWA recovery matrix
        working-directory: client
        run: npx playwright-core install --with-deps webkit

      - name: PWA startup JavaScript budget
        working-directory: client
        run: node scripts/measurePwaStartup.mjs

      - name: Client browser regression tests
        working-directory: client
        run: node --test scripts/*.browser-check.cjs

      - name: PWA installed-mode recovery matrix
        working-directory: client
        run: node --test scripts/pwaInstalledMatrix.installed-check.cjs

      - name: Authenticated admin browser matrix
        working-directory: client
        env:
          OXSTEED_E2E_BASE_URL: ${{ secrets.OXSTEED_E2E_BASE_URL }}
          OXSTEED_E2E_EMAIL: ${{ secrets.OXSTEED_E2E_EMAIL }}
          OXSTEED_E2E_PASSWORD: ${{ secrets.OXSTEED_E2E_PASSWORD }}
          OXSTEED_E2E_SIGNATURE_NAME: ${{ secrets.OXSTEED_E2E_SIGNATURE_NAME }}
          OXSTEED_E2E_2FA_CODE: ${{ secrets.OXSTEED_E2E_2FA_CODE }}
        run: npm run test:admin-authenticated

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Restaurant LAN outage and printer recovery
        run: node --test scripts/restaurant-store-hub.test.cjs scripts/restaurant-store-hub.browser.test.cjs

      - name: Install FFmpeg for video regression tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Migrate disposable statement test database
        working-directory: server
        env:
          DATABASE_URL: postgresql://oxsteed:statement-test-password@127.0.0.1:5432/credit_statement_test?sslmode=disable
          NODE_ENV: test
        run: npm run migrate

      - name: Inventory two-store PostgreSQL regression
        working-directory: server
        env:
          NODE_ENV: test
          INVENTORY_SCOPE_TEST_DATABASE_URL: postgresql://oxsteed:statement-test-password@127.0.0.1:5432/inventory_scope_test?sslmode=disable
        run: |
          node - <<'NODE'
          const { Client } = require('pg');
          const url = new URL(process.env.INVENTORY_SCOPE_TEST_DATABASE_URL);
          url.pathname = '/postgres';
          const db = new Client({ connectionString: url.toString() });
          (async () => {
            try {
              await db.connect();
              await db.query('CREATE DATABASE inventory_scope_test');
            } finally { await db.end(); }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
          npx jest --runInBand __tests__/restaurantInventoryAvailability.db.test.js

      - name: Restaurant payroll, hosting and CRM PostgreSQL regressions
        working-directory: server
        env:
          NODE_ENV: test
          FRANCHISE_SCOPE_TEST_DATABASE_URL: postgresql://oxsteed:statement-test-password@127.0.0.1:5432/franchise_scope_test?sslmode=disable
        run: |
          node - <<'NODE'
          const { Client } = require('pg');
          const url = new URL(process.env.FRANCHISE_SCOPE_TEST_DATABASE_URL);
          url.pathname = '/postgres';
          const db = new Client({ connectionString: url.toString() });
          (async () => {
            try {
              await db.connect();
              await db.query('CREATE DATABASE franchise_scope_test');
            } finally { await db.end(); }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
          npx jest --runInBand __tests__/restaurantThirtyFixes.db.test.js

      - name: Restaurant quality, training and accounting PostgreSQL regressions
        working-directory: server
        env:
          NODE_ENV: test
          FRANCHISE_FIFTY_TEST_DATABASE_URL: postgresql://oxsteed:statement-test-password@127.0.0.1:5432/franchise_fifty_test?sslmode=disable
        run: |
          node - <<'NODE'
          const { Client } = require('pg');
          const url = new URL(process.env.FRANCHISE_FIFTY_TEST_DATABASE_URL);
          url.pathname = '/postgres';
          const db = new Client({ connectionString: url.toString() });
          (async () => {
            try {
              await db.connect();
              for (let attempt = 0; ; attempt += 1) {
                try { await db.query('CREATE DATABASE franchise_fifty_test TEMPLATE credit_statement_test'); break; }
                catch (error) {
                  if (error.code !== '55006' || attempt >= 4) throw error;
                  await new Promise(resolve => setTimeout(resolve, 1000));
                }
              }
            } finally { await db.end(); }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
          npx jest --runInBand __tests__/restaurantFiftyFixes.db.test.js

      - name: Restaurant gift-card fulfillment PostgreSQL regressions
        working-directory: server
        env:
          GIFT_CARD_TEST_DATABASE_URL: postgresql://oxsteed:statement-test-password@127.0.0.1:5432/gift_card_test?sslmode=disable
        run: |
          node - <<'NODE'
          const { Client } = require('pg');
          const db = new Client({ connectionString: process.env.GIFT_CARD_TEST_DATABASE_URL.replace('/gift_card_test','/postgres') });
          (async () => {
            await db.connect();
            try {
              for (let attempt=0;;attempt++) {
                try { await db.query('CREATE DATABASE gift_card_test TEMPLATE credit_statement_test'); break; }
                catch (error) { if (error.code !== '55006' || attempt >= 4) throw error; await new Promise(resolve=>setTimeout(resolve,1000)); }
              }
            }
            finally { await db.end(); }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
          npx jest --runInBand __tests__/restaurantGiftCardFulfillment.db.test.js

      - name: Restaurant assigned-store isolation and service-cycle PostgreSQL regressions
        working-directory: server
        env:
          RESTAURANT_STORE_TEST_DATABASE_URL: postgresql://oxsteed:statement-test-password@127.0.0.1:5432/restaurant_store_test?sslmode=disable
        run: |
          node - <<'NODE'
          const { Client } = require('pg');
          const db = new Client({ connectionString: process.env.RESTAURANT_STORE_TEST_DATABASE_URL.replace('/restaurant_store_test','/postgres') });
          (async () => {
            await db.connect();
            try {
              for (let attempt=0;;attempt++) {
                try { await db.query('CREATE DATABASE restaurant_store_test TEMPLATE credit_statement_test'); break; }
                catch (error) { if (error.code !== '55006' || attempt >= 4) throw error; await new Promise(resolve=>setTimeout(resolve,1000)); }
              }
            }
            finally { await db.end(); }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
          npx jest --runInBand __tests__/restaurantStoreIsolation.db.test.js __tests__/restaurantServiceCycle.db.test.js __tests__/restaurantIntegrationRuntime.db.test.js __tests__/restaurantTerminalOfflineLeases.db.test.js __tests__/restaurantDeviceStatusConvergence.db.test.js

      - name: Restaurant time clock and POS discount PostgreSQL regressions
        working-directory: server
        env:
          ST_T3_TEST_DATABASE_URL: postgresql://oxsteed:statement-test-password@127.0.0.1:5432/st_t3?sslmode=disable
          RESTAURANT_DISCOUNT_TEST_DATABASE_URL: postgresql://oxsteed:statement-test-password@127.0.0.1:5432/st_f15?sslmode=disable
        run: |
          node - <<'NODE'
          const { Client } = require('pg');
          const db = new Client({ connectionString: process.env.ST_T3_TEST_DATABASE_URL.replace('/st_t3','/postgres') });
          (async () => {
            await db.connect();
            try {
              for (const name of ['st_t3', 'st_f15']) {
                for (let attempt=0;;attempt++) {
                  try { await db.query(`CREATE DATABASE ${name} TEMPLATE credit_statement_test`); break; }
                  catch (error) { if (error.code !== '55006' || attempt >= 4) throw error; await new Promise(resolve=>setTimeout(resolve,1000)); }
                }
              }
            }
            finally { await db.end(); }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
          npx jest --runInBand __tests__/businessTimeClock.db.test.js __tests__/staffFairWorkweek.db.test.js __tests__/restaurantDiscountDefinitions.db.test.js

      - name: Careers PostgreSQL regressions
        working-directory: server
        env:
          NODE_ENV: test
          CAREERS_TEST_DATABASE_URL: postgresql://oxsteed:statement-test-password@127.0.0.1:5432/careers_test?sslmode=disable
        run: |
          node - <<'NODE'
          const { Client } = require('pg');
          const url = new URL(process.env.CAREERS_TEST_DATABASE_URL);
          url.pathname = '/postgres';
          const db = new Client({ connectionString: url.toString() });
          (async () => {
            await db.connect();
            try {
              for (let attempt = 0; ; attempt++) {
                try { await db.query('CREATE DATABASE careers_test TEMPLATE credit_statement_test'); break; }
                catch (error) { if (error.code !== '55006' || attempt >= 4) throw error; await new Promise((resolve) => setTimeout(resolve, 1000)); }
              }
            } finally { await db.end(); }
          })().catch((error) => { console.error(error.message); process.exitCode = 1; });
          NODE
          npx jest --runInBand __tests__/careers.db.test.js

      - name: Restaurant operational evidence PostgreSQL regressions
        working-directory: server
        env:
          NODE_ENV: test
          FRANCHISE_HUNDRED_TEST_DATABASE_URL: postgresql://oxsteed:statement-test-password@127.0.0.1:5432/franchise_hundred_test?sslmode=disable
        run: |
          node - <<'NODE'
          const { Client } = require('pg');
          const url = new URL(process.env.FRANCHISE_HUNDRED_TEST_DATABASE_URL);
          url.pathname = '/postgres';
          const db = new Client({ connectionString: url.toString() });
          (async () => {
            try {
              await db.connect();
              for (let attempt = 0; ; attempt += 1) {
                try { await db.query('CREATE DATABASE franchise_hundred_test TEMPLATE credit_statement_test'); break; }
                catch (error) {
                  if (error.code !== '55006' || attempt >= 4) throw error;
                  await new Promise(resolve => setTimeout(resolve, 1000));
                }
              }
            } finally { await db.end(); }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
          npx jest --runInBand __tests__/restaurantHundredFixes.db.test.js

      - name: Logistics isolated database integration
        working-directory: server
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://oxsteed:synthetic-logistics-test-password@127.0.0.1:5434/credit_statement_test?sslmode=disable
          LOGISTICS_CREDIT_PAY_TEST_DATABASE_URL: postgresql://oxsteed:synthetic-logistics-test-password@127.0.0.1:5434/credit_statement_test?sslmode=disable
        run: |
          npm run migrate
          npx jest __tests__/logisticsCreditPay.db.test.js __tests__/logisticsCreditCheckoutFixes.db.test.js __tests__/logisticsDashboardCounts.db.test.js --runInBand --json --outputFile=logistics-db-results.json
          node ../scripts/assert-logistics-db-tests.cjs logistics-db-results.json

      - name: Server entry module smoke
        working-directory: server
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://oxsteed:statement-test-password@127.0.0.1:5432/credit_statement_test?sslmode=disable
          JWT_SECRET: test-jwt-secret-min-32-chars-long!!
          ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
        run: node -e "require('./middleware/launchGate'); require('./utils/logger'); console.log('server boot-critical ok')"

      - name: Server regression and security tests
        working-directory: server
        env:
          NODE_ENV: test
          STATEMENT_TEST_DATABASE_URL: postgresql://oxsteed:statement-test-password@127.0.0.1:5432/credit_statement_test?sslmode=disable
          STATEMENT_JOB_TEST_DATABASE_URL: postgresql://oxsteed:statement-test-password@127.0.0.1:5432/credit_statement_test?sslmode=disable
          STATEMENT_INVESTIGATION_TEST_DATABASE_URL: postgresql://oxsteed:statement-test-password@127.0.0.1:5432/credit_statement_test?sslmode=disable
          ADMIN_GRANT_TEST_DATABASE_URL: postgresql://oxsteed:statement-test-password@127.0.0.1:5432/credit_statement_test?sslmode=disable
          JOB_EDIT_TEST_DATABASE_URL: postgresql://oxsteed:statement-test-password@127.0.0.1:5432/credit_statement_test?sslmode=disable
          STATEMENT_REQUIRE_DB_TESTS: 'true'
          OXSTEED_MEDIA_LAUNCHED: 'true'
          MEDIA_PUBLIC_VIDEO_INTERIM: 'true'
        run: |
          # Complete the capacity case before running the remaining suites.
          npx jest __tests__/statementExportJobs.millionRow.db.test.js --runInBand --json --outputFile=million-row-results.json
          # Invoke Jest directly: npm test adds --forceExit in package.json.
          npx jest --runInBand --detectOpenHandles --json --outputFile=statement-test-results.json --testPathIgnorePatterns=statementExportJobs.millionRow
          node ../scripts/assert-statement-db-tests.cjs statement-test-results.json
          node ../scripts/assert-media-db-tests.cjs statement-test-results.json

      - name: Active job status checks (Jest + optional pg_enum)
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          NODE_ENV: test
        run: |
          npm run test:active-job-statuses
          if [ -n "${DATABASE_URL}" ]; then
            npm run verify:active-job-statuses
            npm run verify:credit
            DIRECT_CATALOG_VERIFY_LIVE=true npm run verify:direct-catalog
          else
            echo "Skipping live database verification (set CI_DATABASE_URL secret for active-job, Credit schema, and Direct catalog checks)."
          fi

  media-isolated:
    name: Disposable Media safety and upload harness
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run Media harness with PostgreSQL, Redis, ClamAV, and FFmpeg
        env:
          COMPOSE_PROJECT: oxsteed-media-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          env_file="$RUNNER_TEMP/oxsteed-media.env"
          cat >"$env_file" <<EOF
          CREDIT_TEST_PROJECT=oxsteed-credit-test-ci-${{ github.run_id }}-${{ github.run_attempt }}
          CREDIT_TEST_POSTGRES_VOLUME=oxsteed-media-ci-${{ github.run_id }}-${{ github.run_attempt }}-postgres
          CREDIT_TEST_REDIS_VOLUME=oxsteed-media-ci-${{ github.run_id }}-${{ github.run_attempt }}-redis
          CREDIT_TEST_POSTGRES_IMAGE=ghcr.io/cloudnative-pg/postgis:16-3.4
          CREDIT_TEST_REDIS_IMAGE=oxsteed-ci-redis:7
          CLAMAV_IMAGE=oxsteed-ci-clamav
          CREDIT_TEST_DB_PASSWORD=$(openssl rand -hex 24)
          CREDIT_TEST_JWT_SECRET=$(openssl rand -hex 32)
          CREDIT_TEST_ENCRYPTION_KEY=$(openssl rand -hex 32)
          CREDIT_TEST_LEDGER_SECRET=$(openssl rand -hex 32)
          EOF
          chmod 600 "$env_file"
          set -a
          # The generated file contains only CI-scoped identifiers and random hex.
          source "$env_file"
          set +a

          node scripts/pull-ci-redis.cjs

          clamav_base=""
          for round in 1 2 3; do
            for source in public.ecr.aws/docker/library/debian:13-slim docker.io/library/debian:13-slim; do
              echo "ClamAV base pull attempt $round/3: $source"
              if docker pull "$source"; then clamav_base="$source"; break 2; fi
            done
            if [ "$round" -lt 3 ]; then sleep $((5 * round)); fi
          done
          if [ -z "$clamav_base" ]; then
            echo "ClamAV base image unavailable from both public registries after three attempts each" >&2
            exit 1
          fi

          docker build --tag "$CLAMAV_IMAGE" --build-arg "BASE_IMAGE=$clamav_base" \
            --file .github/ci/clamav.Dockerfile .github/ci/clamav

          compose=(docker compose --env-file "$env_file" --project-name "$COMPOSE_PROJECT" \
            --file docker-compose.credit-test.yml --file docker-compose.media-test.yml)
          cleanup() {
            "${compose[@]}" down --volumes --remove-orphans || true
          }
          trap cleanup EXIT

          if ! "${compose[@]}" up -d --build; then
            echo 'Media harness compose status:'
            "${compose[@]}" ps || true
            echo 'Media harness ClamAV logs:'
            "${compose[@]}" logs --no-color clamav || true
            exit 1
          fi
          ready=0
          for attempt in $(seq 1 180); do
            if "${compose[@]}" exec -T app curl -fsS http://127.0.0.1:5000/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo 'Media harness did not become ready.'
            "${compose[@]}" ps || true
            echo 'Media harness ClamAV logs:'
            "${compose[@]}" logs --no-color clamav || true
            echo 'Media harness app logs:'
            "${compose[@]}" logs --no-color app || true
            exit 1
          fi

          "${compose[@]}" exec -T -e "PGPASSWORD=$CREDIT_TEST_DB_PASSWORD" postgres \
            psql -v ON_ERROR_STOP=1 -U oxsteed -d oxsteed_db < scripts/credit-isolated-seed.sql
          set +e
          "${compose[@]}" exec -T app node /app/server/scripts/verify-media-isolated.js
          verify_status=$?
          if [ "$verify_status" -eq 0 ]; then
            "${compose[@]}" exec -T app node /app/server/scripts/verify-media-credit-isolated.js
            verify_status=$?
          fi
          set -e
          if [ "$verify_status" -ne 0 ]; then
            echo 'Media harness app logs:'
            "${compose[@]}" logs --no-color app || true
            exit "$verify_status"
          fi

  migration-rehearsal:
    name: PostgreSQL migration rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: install-check
    permissions:
      contents: read
    services:
      postgres:
        image: ghcr.io/cloudnative-pg/postgis:16-3.4
        env:
          POSTGRES_USER: oxsteed
          POSTGRES_PASSWORD: migration-rehearsal-password
          POSTGRES_DB: credit_card_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oxsteed -d credit_card_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Rehearse migration catch-up and checksum replay
        working-directory: server
        env:
          DATABASE_URL: postgresql://oxsteed:migration-rehearsal-password@127.0.0.1:5432/credit_card_security_test?sslmode=disable
          NODE_ENV: test
        run: |
          node --test ../scripts/migration-rehearsal.test.cjs
          REHEARSAL_DATABASE_URL="$DATABASE_URL" node ../scripts/migration-rehearsal.cjs --from 785

      - name: Rehearse card security and concurrent recovery
        working-directory: server
        env:
          DATABASE_URL: postgresql://oxsteed:migration-rehearsal-password@127.0.0.1:5432/credit_card_security_test?sslmode=disable
        run: node scripts/credit-card-security-rehearsal.js

  growth-clickhouse-rehearsal:
    name: ClickHouse growth schema rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Start pinned ClickHouse fixture
        env:
          CLICKHOUSE_IMAGE: clickhouse/clickhouse-server@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
        run: |
          set -euo pipefail
          docker run -d --name oxsteed-growth-clickhouse-ci --network host \
            -e CLICKHOUSE_USER=default \
            -e CLICKHOUSE_PASSWORD=synthetic-growth-only \
            -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            -v "$GITHUB_WORKSPACE/server/growth/testing/clickhouse.xml:/etc/clickhouse-server/config.d/growth-test.xml:ro" \
            "$CLICKHOUSE_IMAGE"
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8123/ping >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs oxsteed-growth-clickhouse-ci || true
          exit 1

      - name: Verify growth ClickHouse migrations and role isolation
        working-directory: server
        env:
          NODE_ENV: test
          GROWTH_CLICKHOUSE_URL: http://127.0.0.1:8123
          GROWTH_CLICKHOUSE_ADMIN_USER: default
          GROWTH_CLICKHOUSE_ADMIN_PASSWORD: synthetic-growth-only
        run: node scripts/verifyGrowthClickhouse.js

      - name: Verify encrypted daily/weekly backups and the restore check
        working-directory: server
        env:
          NODE_ENV: test
          GROWTH_CLICKHOUSE_URL: http://127.0.0.1:8123
          GROWTH_CLICKHOUSE_ADMIN_USER: default
          GROWTH_CLICKHOUSE_ADMIN_PASSWORD: synthetic-growth-only
        run: node scripts/verifyGrowthClickhouseBackups.js

      - name: Growth ingest load smoke (D-ENG-08, synthetic rows, scratch table)
        working-directory: .
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: synthetic-growth-only
        run: |
          set -euo pipefail
          sed -n '1,13p' server/migrations-clickhouse/C002_activity_events.sql \
            | sed -e 's/growth.activity_events ON CLUSTER growth/loadtest.activity_events/' \
                  -e "s/ReplicatedReplacingMergeTree('[^)]*)/ReplacingMergeTree/" > /tmp/loadtest.sql
          auth=(-H "X-ClickHouse-User: $CLICKHOUSE_USER" -H "X-ClickHouse-Key: $CLICKHOUSE_PASSWORD")
          curl -fsS "${auth[@]}" -X POST http://127.0.0.1:8123 -d 'CREATE DATABASE IF NOT EXISTS loadtest'
          curl -fsS "${auth[@]}" -X POST http://127.0.0.1:8123 --data-binary @/tmp/loadtest.sql
          node scripts/growth/clickhouse-load-test.cjs --url=http://127.0.0.1:8123 \
            --table=loadtest.activity_events --eps=2000 --seconds=10 --p99-ms=3000

      - name: Remove ClickHouse fixture
        if: always()
        run: docker rm -f oxsteed-growth-clickhouse-ci >/dev/null 2>&1 || true
