name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install-check:
    name: Install Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Active job status checks (Jest + optional pg_enum)
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
        run: |
          npm run test:active-job-statuses
          if [ -n "${DATABASE_URL}" ]; then
            npm run verify:active-job-statuses
          else
            echo "Skipping verify:active-job-statuses (set CI_DATABASE_URL secret for live DB check)."
          fi

      - name: Install client dependencies
        working-directory: client
        run: npm install

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: install-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Coolify deploy
        run: |
          curl -f -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
