name: Verified web image
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact successful default-branch commit to build
        required: false
        type: string
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
  packages: write
concurrency:
  group: verified-web-image
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
      IMAGE: ghcr.io/oxsteed/old-file-web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Require verified default-branch source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${GITHUB_REF_NAME}" = old-files-claude
          node scripts/verify-web-release.cjs "$RELEASE_SHA"
      - name: Build and publish immutable ARM64 image away from production
        env:
          GHCR_TOKEN: ${{ github.token }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_SEND_DEFAULT_PII: ${{ secrets.VITE_SENTRY_SEND_DEFAULT_PII }}
          VITE_AWS_LOCATION_API_KEY: ${{ secrets.VITE_AWS_LOCATION_API_KEY }}
          VITE_AWS_LOCATION_REGION: ${{ secrets.VITE_AWS_LOCATION_REGION }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use --driver docker-container
          docker buildx build --platform linux/arm64 --push \
            --tag "$IMAGE:sha-$RELEASE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/oxsteed/old-file" \
            --build-arg "SOURCE_COMMIT=$RELEASE_SHA" \
            --build-arg VITE_SENTRY_DSN --build-arg VITE_SENTRY_SEND_DEFAULT_PII \
            --build-arg VITE_AWS_LOCATION_API_KEY --build-arg VITE_AWS_LOCATION_REGION \
            --metadata-file image-metadata.json .
      - name: Verify container shutdown and schema preflight before issuing a release receipt
        run: |
          image_ref="$IMAGE@$(node -p 'JSON.parse(require("fs").readFileSync("image-metadata.json"))["containerimage.digest"]')"
          # The pushed digest can take a few seconds to become readable.
          for delay in 0 2 4 8 16; do
            sleep "$delay"
            if pull_output="$(docker pull "$image_ref" 2>&1)"; then
              printf '%s\n' "$pull_output"
              break
            fi
            printf '%s\n' "$pull_output" >&2
            if [[ "$pull_output" != *'manifest unknown'* || "$delay" == 16 ]]; then
              exit 1
            fi
          done
          node scripts/verify-container-shutdown.cjs --image "$image_ref"
          schema_result="$(printf '[]' | docker run --rm --interactive --pull=never --network=none \
            --read-only --cap-drop=ALL --no-healthcheck --memory=128m --cpus=0.5 \
            --workdir /app/server --entrypoint node "$image_ref" scripts/check-web-schema-snapshot.cjs)"
          node -e '
            const { ok, counts } = JSON.parse(process.argv[1]);
            if (ok !== false || !Number.isSafeInteger(counts?.pending) || counts.pending < 1) {
              throw new Error("Image did not detect missing migrations in an empty snapshot");
            }
          ' "$schema_result"
      - name: Record immutable image receipt
        run: |
          node - <<'JS'
          const fs = require('fs');
          const metadata = JSON.parse(fs.readFileSync('image-metadata.json'));
          const digest = metadata['containerimage.digest'];
          if (!/^sha256:[a-f0-9]{64}$/.test(digest)) throw Error('Missing image digest');
          fs.writeFileSync('web-image-receipt.json', JSON.stringify({
            gitSha: process.env.RELEASE_SHA, image: process.env.IMAGE, digest,
            runId: process.env.GITHUB_RUN_ID, architecture: 'arm64',
          }, null, 2));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: web-image-receipt
          path: web-image-receipt.json
          retention-days: 30
          if-no-files-found: error
