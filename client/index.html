<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preload" href="/src/assets/fonts/inter-10.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link id="oxsteed-manifest" rel="manifest" data-oxsteed-manifest-base="/manifest.json" />
    <script>
      (() => {
        const path = window.location.pathname;
        if (/^\/(restaurants|food)\/(queue|kiosk|kitchen)\/\d+$/.test(path)) {
          const link = document.getElementById('oxsteed-manifest');
          link.href = `/manifest.json?display_start_url=${encodeURIComponent(path)}`;
        } else {
          document.getElementById('oxsteed-manifest').href = '/manifest.json';
        }
      })();
    </script>
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OxSteed" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#16213e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F97316" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Post a job, compare bids from skilled local helpers, and pay on OxSteed. Free to start." />
    <link rel="canonical" href="https://oxsteed.com/" />
    <meta property="og:site_name" content="OxSteed" />
    <meta property="og:title" content="OxSteed - Hire Local Help Today" />
    <meta property="og:description" content="Post a job, compare bids from skilled local helpers, and pay on OxSteed. Free to start." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://oxsteed.com/" />
    <meta property="og:image" content="https://oxsteed.com/icons/icon-512.png" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="ht_HT" />
    <meta property="og:locale:alternate" content="ar_AR" />
    <meta name="telephone" content="+1-937-408-5169" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@oxsteed" />
    <meta name="twitter:title" content="OxSteed - Hire Local Help Today" />
    <meta name="twitter:description" content="Post a job, compare bids from skilled local helpers, and pay on OxSteed. Free to start." />
    <meta name="twitter:image" content="https://oxsteed.com/icons/icon-512.png" />
    <meta name="robots" content="index, follow" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('theme');
          const isDark = saved ? saved === 'dark' : true;
          const root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.setAttribute('data-theme', isDark ? 'dark' : 'light');
          root.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (_) {
          // Keep the dark default when storage is unavailable.
        }
      })();
    </script>
    <title>OxSteed - Hire Local Help Today</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
