<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F97316" />
    <title>Offline - OxSteed</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1a1a2e;
        color: #e2e8f0;
        font-family: 'Inter', system-ui, sans-serif;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        max-width: 380px;
        width: 100%;
      }
      .icon {
        font-size: 3.5rem;
        margin-bottom: 1.25rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 0.75rem;
        color: #f8fafc;
      }
      p {
        font-size: 0.95rem;
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 1.75rem;
      }
      button {
        background: #F97316;
        color: #fff;
        border: none;
        border-radius: 9999px;
        padding: 0.75rem 2rem;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover { background: #ea6a0a; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1 id="heading">You're offline</h1>
      <p id="message">OxSteed can't reach the internet right now. Check your connection and try again.</p>
      <p id="last-opened"></p>
      <button id="reconnect" type="button">Reconnect</button>
    </div>
    <script>
      const messages = {"en": ["You're offline", "OxSteed can't reach the internet right now. Check your connection and reconnect. Last opened does not mean orders or balances are current.", "Reconnect", "Last opened: ", "No previous launch on this device."], "es": ["Sin conexión", "OxSteed no puede conectarse. Comprueba tu conexión. La última apertura no indica que tus pedidos o saldos estén actualizados.", "Reconectar", "Última apertura: ", "No hay una apertura anterior en este dispositivo."], "fr": ["Vous êtes hors ligne", "OxSteed ne peut pas se connecter. Vérifiez votre connexion. La dernière ouverture ne signifie pas que les commandes ou soldes sont à jour.", "Reconnecter", "Dernière ouverture : ", "Aucune ouverture précédente sur cet appareil."], "ht": ["Ou pa konekte", "OxSteed pa ka konekte. Verifye koneksyon ou. Dènye lè ou te louvri a pa vle di kòmann oswa balans ou yo ajou.", "Rekonekte", "Dènye fwa ou te louvri: ", "Pa gen lansman anvan sou aparèy sa a."], "ar": ["أنت غير متصل", "يتعذر الاتصال بـ OxSteed. تحقق من اتصالك. وقت الفتح الأخير لا يعني أن الطلبات أو الأرصدة محدثة.", "إعادة الاتصال", "آخر فتح: ", "لم يُفتح التطبيق سابقًا على هذا الجهاز."]};
      let language = navigator.language?.split('-')[0] || 'en';
      try { language = (localStorage.getItem('i18nextLng') || language).split('-')[0]; } catch {}
      const text = messages[language] || messages.en;
      document.documentElement.lang = messages[language] ? language : 'en';
      document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr';
      document.title = text[0] + ' - OxSteed';
      document.getElementById('heading').textContent = text[0];
      document.getElementById('message').textContent = text[1];
      const reconnect = document.getElementById('reconnect');
      reconnect.textContent = text[2];
      reconnect.addEventListener('click', () => window.location.reload());
      let timestamp;
      try { timestamp = Number(localStorage.getItem('oxsteed:last-opened')); } catch {}
      document.getElementById('last-opened').textContent = Number.isFinite(timestamp) && timestamp > 0
        ? text[3] + new Intl.DateTimeFormat(language, { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(timestamp))
        : text[4];
    </script>
  </body>
</html>
