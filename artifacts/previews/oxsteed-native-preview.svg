<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#faf1df"/>
      <stop offset="0.52" stop-color="#e1f4ef"/>
      <stop offset="1" stop-color="#eef0ff"/>
    </linearGradient>
    <linearGradient id="hero" x1="360" y1="110" x2="860" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142b3f"/>
      <stop offset="1" stop-color="#1c515c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#102033" flood-opacity="0.22"/>
    </filter>
    <style>
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #152334; }
      .body { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526275; }
      .small { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6a7686; letter-spacing: .5px; }
      .nav { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243447; }
      .whiteTitle { font: 800 29px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fffaf0; }
      .whiteBody { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cddbe1; }
      .chip { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #29505a; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <text x="72" y="78" class="title">OxSteed Native iOS Preview</text>
  <text x="72" y="108" class="body">SwiftUI shell with full website capability parity map, native workspaces, and first typed read/write flows.</text>

  <g filter="url(#shadow)">
    <rect x="405" y="58" width="390" height="790" rx="48" fill="#0b1220"/>
    <rect x="420" y="72" width="360" height="760" rx="38" fill="url(#bg)"/>
    <rect x="535" y="86" width="130" height="24" rx="12" fill="#0b1220"/>
  </g>

  <g transform="translate(444 132)">
    <text x="0" y="0" class="title">OxSteed</text>
    <rect x="0" y="30" width="312" height="126" rx="24" fill="url(#hero)"/>
    <text x="20" y="70" class="whiteTitle">Native OxSteed</text>
    <text x="20" y="101" class="whiteBody">A real SwiftUI app shell for the</text>
    <text x="20" y="124" class="whiteBody">whole marketplace, not a webview.</text>
    <circle cx="268" cy="70" r="22" fill="#f39e2e"/>
    <path d="M258 70h20M268 60v20" stroke="#142b3f" stroke-width="4" stroke-linecap="round"/>
    <rect x="20" y="132" width="90" height="18" rx="9" fill="#ffffff" opacity=".12"/>
    <text x="32" y="146" class="chip" fill="#d9e6e8">Signed out</text>
  </g>

  <g transform="translate(444 308)">
    <rect x="0" y="0" width="94" height="76" rx="18" fill="#ffffff" opacity=".78"/>
    <rect x="109" y="0" width="94" height="76" rx="18" fill="#ffffff" opacity=".78"/>
    <rect x="218" y="0" width="94" height="76" rx="18" fill="#ffffff" opacity=".78"/>
    <text x="16" y="33" class="title" font-size="24">13</text>
    <text x="16" y="56" class="small">DOMAINS</text>
    <text x="125" y="33" class="title" font-size="24">64</text>
    <text x="125" y="56" class="small">ROUTES</text>
    <text x="234" y="33" class="title" font-size="24">49</text>
    <text x="234" y="56" class="small">ACTIONS</text>
  </g>

  <g transform="translate(444 420)">
    <text x="0" y="0" class="title" font-size="23">Everything users can do</text>
    <text x="0" y="28" class="body">Mapped into stable native destinations.</text>

    <rect x="0" y="55" width="312" height="112" rx="22" fill="#ffffff" opacity=".82"/>
    <circle cx="32" cy="91" r="19" fill="#f39e2e" opacity=".2"/>
    <text x="60" y="83" class="small" fill="#f39e2e">CUSTOMER JOBS &amp; BOOKINGS</text>
    <text x="60" y="109" class="title" font-size="18">Customer Command Center</text>
    <text x="60" y="134" class="body" font-size="13">Post jobs, bookings, planned needs...</text>
    <text x="18" y="153" class="small">Native shell ready · 4 actions</text>

    <rect x="0" y="183" width="312" height="112" rx="22" fill="#ffffff" opacity=".82"/>
    <circle cx="32" cy="219" r="19" fill="#2f9e72" opacity=".2"/>
    <text x="60" y="211" class="small" fill="#2f9e72">PRODUCT MARKETPLACE</text>
    <text x="60" y="237" class="title" font-size="18">Marketplace Discovery</text>
    <text x="60" y="262" class="body" font-size="13">Product search, tools, helper profiles...</text>
    <text x="18" y="281" class="small">Typed browse/search · 4 actions</text>

    <rect x="0" y="311" width="312" height="112" rx="22" fill="#ffffff" opacity=".82"/>
    <circle cx="32" cy="347" r="19" fill="#536dfe" opacity=".2"/>
    <text x="60" y="339" class="small" fill="#536dfe">LOGISTICS BRANCH</text>
    <text x="60" y="365" class="title" font-size="18">Logistics Branch</text>
    <text x="60" y="390" class="body" font-size="13">Buyer, procurement, operations...</text>
    <text x="18" y="409" class="small">Live request list + create form</text>
  </g>

  <g transform="translate(432 770)">
    <rect x="0" y="0" width="336" height="46" rx="20" fill="#ffffff" opacity=".9"/>
    <text x="24" y="29" class="nav">Today</text>
    <text x="91" y="29" class="nav">Market</text>
    <text x="168" y="29" class="nav">Work</text>
    <text x="229" y="29" class="nav">Logistics</text>
    <text x="300" y="29" class="nav">•••</text>
  </g>

  <g transform="translate(72 190)">
    <rect x="0" y="0" width="270" height="150" rx="26" fill="#ffffff" opacity=".65"/>
    <text x="24" y="42" class="title" font-size="22">Live Native Flows</text>
    <text x="24" y="78" class="body">Post job → /api/jobs</text>
    <text x="24" y="106" class="body">Logistics request → /api/logistics/requests</text>
    <text x="24" y="134" class="body">Auth/session API client</text>
  </g>

  <g transform="translate(858 190)">
    <rect x="0" y="0" width="270" height="190" rx="26" fill="#ffffff" opacity=".65"/>
    <text x="24" y="42" class="title" font-size="22">Typed Read Flows</text>
    <text x="24" y="78" class="body">Dashboard feed</text>
    <text x="24" y="106" class="body">Marketplace browse/search</text>
    <text x="24" y="134" class="body">Inbox conversations</text>
    <text x="24" y="162" class="body">Logistics requests</text>
  </g>
</svg>
